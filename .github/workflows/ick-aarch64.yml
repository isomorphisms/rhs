name: ICK AArch64

on:
  push:
    branches:
      - ick-aarch64
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out live ICK source
        uses: actions/checkout@v4

      - name: Install build and AArch64 tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential flex bison texinfo \
            libgmp-dev libmpfr-dev libmpc-dev libisl-dev libzstd-dev zstd \
            binutils-aarch64-linux-gnu

      - name: Configure AArch64 compiler
        run: |
          mkdir build stage
          cd build
          ../configure \
            --target=aarch64-linux-gnu \
            --prefix="$GITHUB_WORKSPACE/stage" \
            --enable-languages=c \
            --disable-bootstrap \
            --disable-multilib \
            --disable-nls \
            --disable-shared \
            --disable-threads \
            --without-headers \
            --disable-libatomic \
            --disable-libgomp \
            --disable-libquadmath \
            --disable-libssp \
            --disable-libvtv

      - name: Build ICK
        run: |
          make -C build -j2 all-gcc
          make -C build install-gcc
          cat > stage/bin/ick-aarch64 <<'EOF'
          #!/bin/sh
          exec "$(dirname "$0")/aarch64-linux-gnu-gcc" "$@"
          EOF
          chmod +x stage/bin/ick-aarch64

      - name: Verify AArch64 object generation
        shell: bash
        run: |
          set -euxo pipefail
          stage/bin/ick-aarch64 --version
          cc1_path="$(stage/bin/ick-aarch64 -print-prog-name=cc1)"
          test -x "$cc1_path"

          cat > /tmp/plain.c <<'EOF'
          int add(int a, int b) { return a + b; }
          EOF
          stage/bin/ick-aarch64 -O2 -c /tmp/plain.c -o /tmp/plain.o
          aarch64-linux-gnu-readelf -h /tmp/plain.o | tee /tmp/plain.elf
          grep -q 'Machine:.*AArch64' /tmp/plain.elf

      - name: Package compiler
        run: |
          tar --zstd -cf ick-aarch64-linux.tar.zst -C stage .
          sha256sum ick-aarch64-linux.tar.zst > ick-aarch64-linux.tar.zst.sha256

      - name: Upload compiler
        uses: actions/upload-artifact@v4
        with:
          name: ick-aarch64-linux
          path: |
            ick-aarch64-linux.tar.zst
            ick-aarch64-linux.tar.zst.sha256
          if-no-files-found: error
          retention-days: 30
